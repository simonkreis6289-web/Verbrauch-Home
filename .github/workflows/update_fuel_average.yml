name: Bundesweite Spritpreise aktualisieren

on:
  workflow_dispatch:
  schedule:
    # GitHub kann einzelne Cron-Läufe verzögern oder auslassen.
    # Stündliche Prüfungen reduzieren die Abhängigkeit von einem Einzeltermin.
    - cron: '23 * * * *'

permissions:
  contents: write

concurrency:
  group: verbrauch-fuel-average
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prüfen, ob neue Preise fällig sind
        id: due
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          now = datetime.now(timezone.utc)
          manual = os.environ.get('EVENT_NAME') == 'workflow_dispatch'
          last = None
          try:
              payload = json.loads(Path('fuel-prices.json').read_text(encoding='utf-8'))
              value = payload.get('fetched_at')
              if value:
                  last = datetime.fromisoformat(value.replace('Z', '+00:00'))
                  if last.tzinfo is None:
                      last = last.replace(tzinfo=timezone.utc)
          except (OSError, ValueError, TypeError) as exc:
              print('Letzter Abruf nicht auswertbar:', exc)
          age = (now - last) if last else None
          due = manual or age is None or age >= timedelta(hours=3, minutes=45)
          print(f'UTC jetzt: {now.isoformat()}, letzter Abruf: {last}, Alter: {age}, manuell: {manual}, abrufen: {due}')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'run={str(due).lower()}\n')
          PY
      - name: Bundesweite Durchschnittspreise abrufen
        if: steps.due.outputs.run == 'true'
        run: python update_fuel_average.py
      - name: Aktualisierte Daten speichern
        if: steps.due.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fuel-prices.json fuel-price-history.json
          if git diff --cached --quiet; then
            echo 'Keine neuen Werte'
            exit 0
          fi
          git commit -m 'Bundesweite Spritpreise aktualisieren'
          for i in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git reset --hard origin/main
            python update_fuel_average.py
            git add fuel-prices.json fuel-price-history.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Bundesweite Spritpreise aktualisieren'
          done
          exit 1
