name: Energiepreise prüfen

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: energiepreise-update
  cancel-in-progress: false

jobs:
  prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python-Abhängigkeiten installieren
        run: pip install requests beautifulsoup4
      - name: Marktpreise auf aktuellem main sicher aktualisieren
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4; do
            echo "Aktualisierungsversuch $attempt"
            git fetch origin main
            git reset --hard origin/main
            python update_market_prices.py
            git add market-prices.json market-price-history.json
            if git diff --cached --quiet; then
              echo "Keine Änderungen vorhanden."
              exit 0
            fi
            git commit -m "Marktpreise und Preisverlauf aktualisieren"
            if git push origin HEAD:main; then
              echo "Marktpreise erfolgreich veröffentlicht."
              exit 0
            fi
            echo "Remote hat sich geändert. Neuer Versuch mit aktuellen Dateien."
            sleep 2
          done
          echo "Konnte nach mehreren Versuchen nicht pushen." >&2
          exit 1
