name: Energiepreise prüfen

on:
  schedule:
    # GitHub-Zeitplaene verwenden UTC. Sommer: 08/15 UTC, Winter: 09/16 UTC.
    # Ein Zeit-Guard im Job laesst davon nur 10:00 / 17:00 Uhr Berlin durch.
    - cron: '0 8,9,15,16 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: energiepreise-update
  cancel-in-progress: false

jobs:
  prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python-Abhängigkeiten installieren
        run: pip install requests beautifulsoup4
      - name: Nur um 10 und 17 Uhr (Europe/Berlin) laufen
        id: time_gate
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [[ "$(TZ=Europe/Berlin date +%H)" == "10" || "$(TZ=Europe/Berlin date +%H)" == "17" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Diese UTC-Planung ist nicht fuer die aktuelle Sommer-/Winterzeit."
          fi
      - name: Marktpreise auf aktuellem main sicher aktualisieren
        if: steps.time_gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4; do
            echo "Aktualisierungsversuch $attempt"
            git fetch origin main
            git reset --hard origin/main
            python update_market_prices.py
            git add market-prices.json market-price-history.json market-price-snapshots.json
            if git diff --cached --quiet; then
              echo "Keine Änderungen vorhanden."
              exit 0
            fi
            git commit -m "Marktpreise und Preisverlauf aktualisieren"
            if git push origin HEAD:main; then
              echo "Marktpreise erfolgreich veröffentlicht."
              exit 0
            fi
            echo "Remote hat sich geändert. Neuer Versuch mit aktuellen Dateien."
            sleep 2
          done
          echo "Konnte nach mehreren Versuchen nicht pushen." >&2
          exit 1
